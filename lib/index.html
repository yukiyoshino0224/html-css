<h1>トライアスロン応募フォーム</h1>
<form action="#" method="post" enctype="multipart/form-data">
    <label for="namefield">
    名前：
    </label>
        <input id="namefield" type="text" name="name"><br>
    パスワード：
        <input type="password" name="pass"><br>
    
    性別：
        <input type="radio" name="gender" value="male" checkd>男
        <input type="radio" name="gender" value="female" check>女<br>
    種目：
        <input type="checkbox" name="triathlon" value="swim" check>水泳
        <input type="checkbox" name="triathlon" value="bike" check>自転車
        <input type="checkbox" name="triathlon" value="run" check>走る<br>
    本人確認書類：
        <input type="file" name="resume"><br>
    <input type="hidden" name="employeeID" value="12345">
    参加理由：
        <br>
        <textarea name="remarks" rows="5" cols="50">初期値</textarea><br>
    得意種目：
        <br>
        <select name="advantage" multiple>
            <option value="swim">水泳</option>
            <option value="bike">自転車</option>
            <option value="run">走る</option>
        </select><br>
    <br>
    <button type="reset">
    リセット
    </button>
    <button>
    送信
    </button>
    <button type="button">
    ただのボタン
    </button>
    
    


</form>
